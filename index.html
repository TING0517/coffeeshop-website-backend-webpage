<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight Café 後台管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 導覽列 -->
    <!-- <nav class="navbar navbar-expand-lg sticky-top navbar-custom navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand">Moonlight Café</a>
        </div>
    </nav> -->

    <div class="container py-5">
        <!-- 登入區塊 -->
        <div id="login-section">
            <h1 class="login-title">Moonlight Café</h1>
            <h5 class="login-subtitle">請登入進入後台管理系統</h5>

            <!-- 使用 flex 居中按鈕 -->
            <div class="d-flex justify-content-center">
                <button id="login-btn" class="btn btn-login-google">
                    <img src="./images/google.webp" alt="Google Logo">
                    <span>使用 Google 帳號登入</span>
                </button>
            </div>
        </div>

        <!-- 管理員內容區塊 -->
        <div id="admin-content" style="display: none;">
            <!-- 歡迎訊息 Alert -->
            <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    class="bi bi-check-circle-fill me-2" viewBox="0 0 16 16">
                    <path
                        d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                </svg>
                <div>
                    歡迎回來，<span id="admin-name" class="fw-bold"></span>！您已成功進入系統。
                </div>
            </div>

            <!-- 功能卡片區 -->
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center p-5">
                            <h5 class="card-title">📦 商品管理</h5>
                            <p class="card-text mb-4">新增、修改或下架咖啡豆與飲品品項。</p>
                            <a href="product-management.html" class="btn btn-primary w-100">前往管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center p-5">
                            <h5 class="card-title">📋 訂單監控</h5>
                            <p class="card-text mb-4">即時查看顧客訂單狀態與處理進度。</p>
                            <a href="order-monitor.html" class="btn btn-dark w-100">查看訂單</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 引入 Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut,
            setPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase 專案配置
        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 設定管理員 white list
        const adminEmails = ["moonlightcafe.com@gmail.com"];
        const loginBtn = document.getElementById('login-btn');
        const loginSection = document.getElementById('login-section');
        const adminContent = document.getElementById('admin-content');
        const adminNameSpan = document.getElementById('admin-name');


        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 檢查是否在管理員白名單內
                if (adminEmails.includes(user.email)) {
                    console.log("驗證成功，準備跳轉...");
                    // 更新 UI
                    adminNameSpan.textContent = user.displayName;
                    // 原本直接跳轉，現在為了展示效果，先顯示內容（實際使用可根據需求調整）
                    // 為了避免瞬間跳轉看不到新樣式，這裡可以稍微延遲，或者直接顯示 adminContent
                    // 但依照原邏輯是直接跳轉：
                    window.location.href = "order_page.html";

                } else {
                    // 非管理員
                    alert("權限不足：您的帳號並非授權商家。");
                    signOut(auth);
                }
            } else {
                // 未登入狀態
                loginSection.style.display = 'block';
                adminContent.style.display = 'none';
            }
        });

        // 登入事件
        loginBtn.onclick = async () => {
            try {
                await setPersistence(auth, browserSessionPersistence);
                await signInWithPopup(auth, provider);
                console.log("登入成功");
            } catch (error) {
                console.error("登入錯誤代碼:", error.code);
                console.error("錯誤訊息:", error.message);
                alert("登入失敗");
            }
        };
    </script>
</body>

</html>
